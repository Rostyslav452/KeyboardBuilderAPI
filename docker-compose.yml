services:
    app:
        build: .
        container_name: mechanical_keyboard_builder_api
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        environment:
            - DB_HOST=db
            - NODE_ENV=production
        networks:
            - private_net
            - public_net
        command: sh -c "npm run migration && npm start"
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://localhost:3000/health',
                ]
            interval: 10s
            retries: 5
            timeout: 5s
    db:
        image: mysql:8.0
        ports:
            - '3306:3306'
        restart: always
        networks:
            - private_net
        environment:
            - MYSQL_DATABASE=${DB_NAME}
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 20s
            retries: 10
    nginx:
        image: nginx:alpine
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        networks:
            - public_net

networks:
    public_net:
    private_net:

volumes:
    db_data:
