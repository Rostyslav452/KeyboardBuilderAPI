version: '3'

services:
  app:
    build: .
    container_name: my_backend_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - DB_HOST=db
    networks:
      - public_net
      - private_net
    command: sh -c "sleep 15 && npm run migration && npm start"
  db:
    image: mysql
    ports:
      - "3306:3306"
    networks:
      - private_net
    environment: 
      - MYSQL_DATABASE=${DB_NAME}
#      - MYSQL_USER=${DB_USERNAME}
#      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}

networks:
  public_net:
  private_net:
