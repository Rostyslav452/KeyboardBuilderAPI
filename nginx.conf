http {
    server {
    listen 80 default_server;
    server_name _; # Означає "будь-яке ім'я"
    return 444; # Просто кидаємо слухавку
    }

    server {
        listen 433;
        client_max_body_size 2M;
        server_name mechanical_keyboard_builder_api;

        ssl_certificate /etc/letsencrypt/live/api.mykeyboard.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mykeyboard.com/privkey.pem;
        
        location / {
            proxy_pass http://app:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}